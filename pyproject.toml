[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pygame-framecraft"
version = "1.0.0"
description = "A lightweight educational game framework built on top of Pygame."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "CodeRoom" }
]

keywords = [
    "pygame",
    "education",
    "game-development",
    "teaching",
    "python",
    "coderoom"
]

classifiers = [
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Education",
    "Topic :: Games/Entertainment"
]

dependencies = [
    "pygame>=2.5"
]

[project.urls]
Homepage = "https://www.coderoom.eu/en/framecraft"
Repository = "https://github.com/gab211/pygame-framecraft"
Issues = "https://github.com/gab211/pygame-framecraft/issues"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "frameCraft",
    "frameCraftGFX",
    "frameCraftUI"
]