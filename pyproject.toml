[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pygame-framecraft"
version = "0.1.0"
description = "A lightweight educational game framework built on a pygame-compatible API."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "CodeRoom" }
]
keywords = [
    "pygame",
    "education",
    "game-development",
    "teaching",
    "python",
    "coderoom"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Games/Entertainment"
]
dependencies = [
    "pygame>=2.5"
]

[project.urls]
Homepage = "https://www.coderoom.de/"
Repository = "https://github.com/REPLACE-WITH-YOUR-ORG/pygame-framecraft"
Issues = "https://github.com/REPLACE-WITH-YOUR-ORG/pygame-framecraft/issues"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "frameCraft",
    "frameCraftGFX",
    "frameCraftUI"
]
